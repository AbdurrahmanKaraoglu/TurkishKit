name: turkish_kit_example
description: "Demonstrates the turkish_kit package."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  turkish_kit:
    path: ..
  turkish_kit_flutter:
    path: ../../turkish_kit_flutter

# turkish_kit_flutter depends on the hosted turkish_kit; use the local one.
dependency_overrides:
  turkish_kit:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
